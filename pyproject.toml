[project]
name = "sps-genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "calebhu1110", email = "caleb24.cc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "spacy>=3.8.16",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pillow>=10.0.0",
]

# Only needed to re-train the model; not installed in the Docker image.
[dependency-groups]
train = ["numpy", "pandas", "pyarrow"]

[project.scripts]
sps-genai = "sps_genai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"


[tool.uv]
package = false

# Use the small CPU-only PyTorch build everywhere except macOS (keeps the Docker image small).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
